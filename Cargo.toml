[package]
name = "hyboard-bridge"
version = "0.1.1"
edition = "2024"
authors = ["hyboard-bridge contributors"]
description = "High-performance bridge daemon connecting X-board / V2board UniProxy API to Hysteria 2 native core"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dashmap = "6.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "2.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"        # Optimize for binary size
lto = true             # Enable link-time optimization
codegen-units = 1      # Maximize size reduction optimizations
panic = "abort"        # Remove unwinding landing pads
strip = true           # Automatically strip symbols from binary
