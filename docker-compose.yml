version: '3.8'

services:
  # ============================================================================
  # 1. hyboard-bridge: Orchestrator, Multi-Node Webhook & Traffic Reporter
  # ============================================================================
  hyboard-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: hyboard-bridge:latest
    container_name: hyboard-bridge
    restart: unless-stopped
    volumes:
      # 单节点模式可使用 .env；多节点/多面板模式推荐直接挂载 config.toml:
      - ./config.toml:/app/config.toml:ro
    ports:
      - "9999:9999"
    networks:
      - hyboard-net

  # ============================================================================
  # 2. Hysteria 2 Node 1 (HK Node - e.g. Port 443 / trafficStats 7654)
  # ============================================================================
  hysteria-node1:
    image: apernet/hysteria:latest
    container_name: hysteria-node1
    restart: unless-stopped
    command: ["server", "-c", "/etc/hysteria/server-node1.yaml"]
    volumes:
      - ./server-node1.yaml:/etc/hysteria/server-node1.yaml:ro
      - ./certs:/etc/hysteria/certs:ro
    ports:
      - "443:443/udp"
      - "443:443/tcp"
    networks:
      - hyboard-net
    depends_on:
      - hyboard-bridge

networks:
  hyboard-net:
    driver: bridge
